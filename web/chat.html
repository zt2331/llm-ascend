<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen3.6-27B · 推理性能对话台</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --fg:#e6e9ef; --dim:#8b93a3; --accent:#4f8cff; --ok:#3ecf8e;
    --warn:#f5a623; --err:#ff5c5c; --prefill:#4f8cff; --decode:#3ecf8e;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header{
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line);
  }
  header h1{font-size:15px; margin:0 8px 0 0; font-weight:600; white-space:nowrap}
  input,select,button,textarea{
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:6px 9px; font-size:13px; font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent)}
  button{cursor:pointer; transition:.15s}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
  button.primary:disabled{opacity:.5; cursor:not-allowed}
  button.ghost{background:transparent}
  .grow{flex:1}
  #addr{width:300px}
  #stat{font-size:12px; color:var(--dim)}
  #stat.ok{color:var(--ok)} #stat.err{color:var(--err)}
  #noteBox{
    display:none; white-space:pre-wrap; font-size:12.5px; line-height:1.7;
    padding:10px 16px; background:#1c2333; border-bottom:1px solid var(--line);
    color:#b9c4d6; font-family:ui-monospace,Menlo,Consolas,monospace;
  }

  main{flex:1; display:flex; min-height:0}
  #chatcol{flex:1; display:flex; flex-direction:column; min-width:0}
  #msgs{flex:1; overflow-y:auto; padding:18px 20px 6px}
  .msg{display:flex; gap:10px; margin-bottom:16px; align-items:flex-start}
  .msg .who{
    flex:0 0 30px; height:30px; border-radius:7px; display:grid; place-items:center;
    font-size:12px; font-weight:700;
  }
  .msg.user .who{background:#2b3a55; color:#9dc0ff}
  .msg.bot .who{background:#1f3d33; color:#7fe0b6}
  .msg .body{
    flex:1; min-width:0; background:var(--panel); border:1px solid var(--line);
    border-radius:9px; padding:10px 13px; white-space:pre-wrap; word-break:break-word;
  }
  .msg.user .body{background:#1b2436}
  .msg .meta{
    margin-top:7px; padding-top:6px; border-top:1px dashed var(--line);
    font-size:11.5px; color:var(--dim); display:flex; gap:12px; flex-wrap:wrap;
    font-variant-numeric:tabular-nums;
  }
  .msg .meta b{font-weight:600}
  .m-prefill{color:var(--prefill)} .m-decode{color:var(--decode)}
  .caret{display:inline-block; width:7px; height:15px; background:var(--accent);
         vertical-align:-2px; animation:bl 1s steps(2) infinite}
  @keyframes bl{50%{opacity:0}}

  #composer{border-top:1px solid var(--line); background:var(--panel); padding:12px 16px}
  #composer .row{display:flex; gap:10px; align-items:flex-end}
  textarea{flex:1; resize:none; height:64px; line-height:1.5}
  .hint{font-size:11.5px; color:var(--dim); margin-top:6px}

  aside{
    flex:0 0 340px; border-left:1px solid var(--line); background:var(--panel);
    display:flex; flex-direction:column; min-height:0;
  }
  aside h2{
    font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim);
    margin:0; padding:11px 14px; border-bottom:1px solid var(--line); font-weight:600;
  }
  #metrics{padding:12px 14px; border-bottom:1px solid var(--line)}
  #m-warn{
    display:none; white-space:pre-wrap; font-size:11.5px; line-height:1.6;
    background:#3a2a12; border:1px solid #6b4a15; color:#f0c674;
    border-radius:6px; padding:8px 10px; margin-bottom:10px;
  }
  .kv{display:flex; justify-content:space-between; padding:3px 0; font-size:13px;
      font-variant-numeric:tabular-nums}
  .kv span:first-child{color:var(--dim)}
  .kv .big{font-size:17px; font-weight:700}
  .bar{height:5px; background:var(--panel2); border-radius:3px; overflow:hidden; margin:2px 0 8px}
  .bar > i{display:block; height:100%; width:0; transition:width .18s}
  .bar.p > i{background:var(--prefill)} .bar.d > i{background:var(--decode)}
  #hist{flex:1; overflow-y:auto}
  table{width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums}
  th,td{padding:6px 10px; text-align:right; border-bottom:1px solid var(--line)}
  th{color:var(--dim); font-weight:600; position:sticky; top:0; background:var(--panel)}
  th:first-child,td:first-child{text-align:left}
  td.pre{color:var(--prefill)} td.dec{color:var(--decode)}
  #spark{width:100%; height:70px; display:block; padding:8px 14px 0}
  .empty{color:var(--dim); font-size:12px; padding:14px; text-align:center}
</style>
</head>
<body>

<header>
  <h1>推理性能对话台</h1>
  <input id="addr" value="" placeholder="vLLM 地址（连接失败时会给出排查提示）">
  <select id="model"><option value="">（点“连接”获取模型）</option></select>
  <button id="conn" class="primary">连接</button>
  <span id="stat">未连接</span>
  <span class="grow"></span>
  <label style="font-size:12px;color:var(--dim)">max_tokens
    <input id="maxtok" type="number" value="256" min="1" style="width:74px"></label>
  <label style="font-size:12px;color:var(--dim)">temp
    <input id="temp" type="number" value="0" step="0.1" min="0" style="width:60px"></label>
  <label style="font-size:12px;color:var(--dim)" title="关闭后发送 chat_template_kwargs.enable_thinking=false，模型不再输出思维链">
    <input id="think" type="checkbox"> 思考模式</label>
  <button id="bench" class="ghost" title="用固定问题连发 N 次，统计波动">压测 ×5</button>
</header>
<div id="noteBox"></div>

<main>
  <div id="chatcol">
    <div id="msgs"><div class="empty">点右上「连接」→ 在下面输入问题。<br>
      每轮回答下方会显示 <b>TTFT</b>（首 token 延迟 ≈ prefill）与 <b>decode 速度</b>。</div></div>
    <div id="composer">
      <div class="row">
        <textarea id="input" placeholder="输入问题…  （Ctrl/⌘ + Enter 发送）"></textarea>
        <button id="send" class="primary" style="height:64px;padding:0 22px">发送</button>
      </div>
      <div class="hint">
        <b>TTFT</b> = 请求发出 → 第一个 token 到达，反映 <b>prefill</b> 阶段；
        <b>decode 速度</b> = (输出 token 数 − 1) ÷ (末 token − 首 token)，即稳态逐 token 速度。
      </div>
    </div>
  </div>

  <aside>
    <h2>本轮指标</h2>
    <div id="metrics">
      <div id="m-warn"></div>
      <div class="kv"><span>TTFT（首 token）</span><span class="big" id="m-ttft">—</span></div>
      <div class="bar p"><i id="b-prefill"></i></div>
      <div class="kv"><span>Prefill 速度</span><span class="m-prefill" id="m-prefill">—</span></div>
      <div class="kv"><span>输入 tokens</span><span id="m-ptok">—</span></div>
      <div class="kv" style="margin-top:10px"><span>Decode 速度</span><span class="big m-decode" id="m-decode">—</span></div>
      <div class="bar d"><i id="b-decode"></i></div>
      <div class="kv"><span>输出 tokens</span><span id="m-ctok">—</span></div>
      <div class="kv"><span>总耗时</span><span id="m-total">—</span></div>
      <div class="kv"><span>生成阶段</span><span id="m-gen">—</span></div>
    </div>
    <h2>Decode 速度趋势 (tok/s)</h2>
    <canvas id="spark"></canvas>
    <h2>历史轮次</h2>
    <div id="hist"><div class="empty">尚无记录</div></div>
  </aside>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const msgs = $("msgs"), hist = $("hist");
let running = false;
const runs = [];   // 每轮指标

// ---------- 连接 ----------
// ★ 默认地址自动推断：云 IDE（如华为云 online-*.huawei.com）把端口代理到
//   https://<host>/proxy/<port>/。此时浏览器里的 127.0.0.1 是【浏览器自己的
//   机器】，连不到容器内的 vLLM；HTTPS 页面请求 HTTP 还会被按混合内容拦掉
//   （都表现为 "Failed to fetch"）。所以这里按优先顺序探测候选地址。
function guessBase() {
  const u = new URL(location.href);
  const m = u.pathname.match(/^(.*\/proxy\/)(\d+)(\/|$)/);
  if (m) return `${u.origin}${m[1]}8000`;          // 同源代理下的 8000
  if (u.protocol === "https:")
    return `${u.origin}`;                          // https 下不能写 http 直连
  return `${u.protocol}//${u.hostname}:8000`;
}

const VLLM_PORT = "8000";
function candidates() {
  const u = new URL(location.href);
  const out = [];
  // ① 页面所在目录 —— 用 scripts/serve_chat.sh（中继模式）时，页面与 /v1/*
  //    同端口同前缀，这一条直接命中：不跨域、也不涉及 mixed content。
  //    ★ 必须用 new URL(".", href) 而不是 origin —— 云 IDE 下页面在
  //    /proxy/8080/ 而 origin 是根路径，用 origin 会丢掉 /proxy/8080 前缀。
  const dir = new URL(".", location.href).href.replace(/\/+$/, "");
  out.push(dir);
  // ② 云 IDE 代理：把 /proxy/<本页端口>/ 换成 /proxy/8000/
  const m = u.pathname.match(/^(.*\/proxy\/)(\d+)(\/|$)/);
  if (m) out.push(`${u.origin}${m[1]}${VLLM_PORT}`);
  // ③ 直连：http 环境下的 host:8000
  if (u.protocol === "http:") out.push(`${u.protocol}//${u.hostname}:${VLLM_PORT}`);
  return [...new Set(out)];
}
// 兼容入口：仍保留 guessBase（默认填第一个候选）
function guessBase() { return candidates()[0]; }

// 逐个候选试连，第一个通的就采用
async function autoConnect() {
  const list = candidates();
  const tried = [];
  for (const c of list) {
    $("stat").textContent = `探测 ${c} …`; $("stat").className = "";
    try {
      const r = await fetch(c + "/v1/models", {cache:"no-store"});
      if (!r.ok) { tried.push(`${c} → HTTP ${r.status}`); continue; }
      const d = await r.json();
      const ids = (d.data || []).map(x => x.id);
      if (!ids.length) { tried.push(`${c} → 无模型`); continue; }
      $("addr").value = c;
      $("model").innerHTML = ids.map(i => `<option>${esc(i)}</option>`).join("");
      $("stat").textContent = "已连接 · " + ids.length + " 个模型";
      $("stat").className = "ok";
      base_ = c;
      return true;
    } catch (e) { tried.push(`${c} → ${e.message}`); }
  }
  $("addr").value = list[0];
  $("stat").textContent = "未找到可用接口";
  $("stat").className = "err";
  note("已自动尝试以下地址，均失败：\n  " + tried.join("\n  ") + "\n\n"
     + (list[0] === location.origin
        ? "同源地址不通，通常说明本页是用普通静态服务器打开的（不是 chat_relay）。\n"
          + "请改用: bash scripts/serve_chat.sh  （它同时托管页面与 /v1 反代）"
        : "请确认 vLLM 已启动，或在上面手动填写正确地址后点「连接」。"));
  return false;
}
function note(text) {
  const box = $("noteBox");
  box.textContent = text;
  box.style.display = "block";
}

async function connect(){
  const base = $("addr").value.replace(/\/+$/,"");
  $("stat").textContent = "连接中…"; $("stat").className = "";
  $("noteBox").style.display = "none";
  try{
    const r = await fetch(base + "/v1/models", {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status + " " + (await r.text()).slice(0,120));
    const d = await r.json();
    const ids = (d.data||[]).map(m=>m.id);
    if(!ids.length) throw new Error("返回里没有模型");
    $("model").innerHTML = ids.map(i=>`<option>${esc(i)}</option>`).join("");
    $("stat").textContent = "已连接 · " + ids.length + " 个模型";
    $("stat").className = "ok";
    base_ = base;
  }catch(e){
    $("stat").textContent = "连接失败: " + e.message;
    $("stat").className = "err";
    note(diagnose(e, base));
  }
}

// 把 "Failed to fetch" 这种无信息量的报错翻译成可操作的原因
function diagnose(e, base) {
  const u = new URL(location.href);
  const lines = [`连接 ${base}/v1/models 失败：${e.message}`, ""];
  if (e.message.includes("Failed to fetch")) {
    lines.push("「Failed to fetch」的常见原因（按可能性排序）：");
    if (/^https:/.test(base) === false && u.protocol === "https:")
      lines.push("  1. ★ 页面是 HTTPS，却要请求 HTTP —— 浏览器按「混合内容」直接拦截。"
                 + "请改用 https 的代理地址（如 https://<host>/proxy/8000）");
    if (/127\.0\.0\.1|localhost/.test(base))
      lines.push("  2. ★ 地址里的 127.0.0.1 是【浏览器所在机器】，不是服务器。"
                 + "在云 IDE/远程环境里它连不到容器内的 vLLM");
    lines.push("  3. vLLM 服务没起来 —— 在服务器上执行："
               + " curl -s http://127.0.0.1:8000/v1/models");
    lines.push("  4. 直连时被 CORS 拦 —— vLLM 需要 --allowed-origins '[\"*\"]'");
  } else if (e.message.includes("404")) {
    lines.push("404 通常是代理路径不对：确认地址带了 /proxy/<端口> 前缀，"
               + "且端口与 vLLM 实际监听端口一致。");
  }
  lines.push("");
  lines.push("可直接在浏览器打开这个地址自测（应返回 JSON）：");
  lines.push(`  ${base}/v1/models`);
  return lines.join("\n");
}
let base_ = "";
$("conn").onclick = connect;
$("addr").addEventListener("keydown", e=>{ if(e.key==="Enter") connect(); });

// ---------- 工具 ----------
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (v,d=1) => (v===null||v===undefined||!isFinite(v)) ? "—" : v.toFixed(d);
const secs = ms => ms<1000 ? ms.toFixed(0)+" ms" : (ms/1000).toFixed(2)+" s";

function addMsg(who, text){
  const el = document.createElement("div");
  el.className = "msg " + (who==="你" ? "user" : "bot");
  el.innerHTML = `<div class="who">${who==="你"?"你":"AI"}</div>
                  <div class="body"><span class="txt"></span></div>`;
  const txt = el.querySelector(".txt");
  txt.textContent = text;
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
  return {el, txt};
}

// ---------- 单轮请求 ----------
// 返回 {ttft, genMs, totalMs, promptTokens, completionTokens, text,
//       buffered, tFirst, tLast}
async function ask(prompt, onDelta, onTick){
  const base = base_ || $("addr").value.replace(/\/+$/,"");
  const think = $("think").checked;
  const mkBody = (withKw) => {
    const b = {
      model: $("model").value,
      messages: history.concat([{role:"user", content:prompt}]),
      max_tokens: parseInt($("maxtok").value,10) || 256,
      temperature: parseFloat($("temp").value) || 0,
      stream: true,
      stream_options: {include_usage: true}   // ★ 让 vLLM 回传精确 token 数
    };
    // ★ 关闭思考模式：Qwen3 系列的 chat template 认这个开关，
    //   打开时会先输出一大段思维链（既慢又占输出 token）
    if(withKw && !think) b.chat_template_kwargs = {enable_thinking: false};
    return b;
  };

  const t0 = performance.now();
  const send = (withKw) => fetch(base + "/v1/chat/completions", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(mkBody(withKw))
  });

  let r = await send(true);
  if(!r.ok && !$("think").checked){
    // 该模型/模板不认 chat_template_kwargs 时不要整个失败，退回不带该字段重试
    const txt = (await r.text()).slice(0,200);
    if(r.status === 400 && /chat_template|enable_thinking|unknown|extra/i.test(txt)){
      note("该模型似乎不支持 chat_template_kwargs.enable_thinking，"
         + "已退回普通请求。若要关闭思维链，可改用 vLLM 启动参数 "
         + "--default-chat-template-kwargs '{\"enable_thinking\": false}'。");
      r = await send(false);
    } else {
      throw new Error("HTTP " + r.status + " " + txt);
    }
  }
  if(!r.ok) throw new Error("HTTP " + r.status + " " + (await r.text()).slice(0,200));

  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = "", tFirst = null, tLast = null, chunks = 0, usage = null, text = "";

  const tick = setInterval(()=>{
    if(tFirst === null) return;
    const gen = performance.now() - tFirst;
    if(onTick) onTick({ genMs: gen, chunks,
                        decode: chunks>1 ? (chunks-1)/(gen/1000) : 0 });
  }, 120);

  try{
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split("\n");
      buf = lines.pop();
      for(const raw of lines){
        const line = raw.trim();
        if(!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if(payload === "[DONE]") continue;
        let j; try{ j = JSON.parse(payload); }catch(_){ continue; }
        if(j.usage) usage = j.usage;
        const d = j.choices && j.choices[0] && j.choices[0].delta;
        const piece = d && d.content;
        if(piece){
          const now = performance.now();
          if(tFirst === null) tFirst = now;
          tLast = now;                       // ★ 最后一个内容 token 的时刻
          text += piece; chunks++;
          if(onDelta) onDelta(text);
        }
      }
    }
  } finally { clearInterval(tick); }

  const tEnd = performance.now();
  const ttft   = (tFirst ?? tEnd) - t0;
  // ★ 生成阶段用「最后一个内容 token」而非流结束时刻：
  //   流末尾还有 usage 块与 [DONE]，把它们算进生成阶段会低估 decode 速度。
  const genMs  = Math.max((tLast ?? tEnd) - (tFirst ?? tEnd), 1e-6);
  // 优先用服务端 usage；缺失时退化为「chunk 数」近似
  const ptok = usage ? usage.prompt_tokens     : null;
  const ctok = usage ? usage.completion_tokens : chunks;
  const totalMs = tEnd - t0;

  // ★ 缓冲检测：若前置代理（云 IDE 的 nginx 等）把 SSE 攒齐才发，
  //   则所有 token 在同一瞬间到达 → 生成阶段极短、decode 大得离谱。
  //   此时 TTFT 其实等于整个生成耗时，数字全是假的，必须明确告诉用户，
  //   而不是显示一个看起来很正常/很惊人的值。
  //   判据：输出 >= 10 个 token，但生成阶段占比 < 5%（正常应占 60%+）。
  const buffered = ctok >= 10 && genMs < 0.05 * totalMs;

  return { ttft, genMs, totalMs, promptTokens: ptok,
           completionTokens: ctok, text, exact: !!usage, buffered };
}

// ---------- 会话历史（供多轮上下文） ----------
let history = [];

// ---------- 发送 ----------
let sending = false;
async function send(){
  const prompt = $("input").value.trim();
  if(!prompt || sending) return;
  sending = true; $("send").disabled = true; $("input").value = "";
  if(msgs.querySelector(".empty")) msgs.innerHTML = "";

  addMsg("你", prompt);
  const {txt} = addMsg("AI", "");
  const caret = document.createElement("span");
  caret.className = "caret"; txt.after(caret);

  resetMetrics();
  try{
    const m = await ask(prompt,
      t => { txt.textContent = t; msgs.scrollTop = msgs.scrollHeight; },
      o => { $("m-decode").textContent = fmt(o.decode,1) + " tok/s";
             $("m-gen").textContent = secs(o.genMs); });
    caret.remove();
    txt.textContent = m.text || "(空回复)";

    const prefill = (m.promptTokens && m.ttft>0)
      ? m.promptTokens / (m.ttft/1000) : null;
    const decode  = m.completionTokens>1 ? (m.completionTokens-1)/(m.genMs/1000) : null;

    // 先入 runs 再 paint：paint 用 runs 里的历史最佳做条形归一化，
    // 顺序反了会让本轮的最佳值不算进去（条形恒为满格）
    runs.push({ttft:m.ttft, prefill, decode, ctok:m.completionTokens,
               buffered:m.buffered});
    paint({...m, prefill, decode});
    addHistory(m, prefill, decode);
    drawSpark();
    history.push({role:"user", content:prompt});
    history.push({role:"assistant", content:m.text});
  }catch(e){
    caret.remove();
    txt.textContent = "❌ " + e.message;
    txt.style.color = "var(--err)";
    if (e.message.includes("Failed to fetch"))
      note(diagnose(e, base_ || $("addr").value.replace(/\/+$/,"")));
  }finally{
    sending = false; $("send").disabled = false; $("input").focus();
  }
}
$("send").onclick = send;
$("input").addEventListener("keydown", e=>{
  if((e.ctrlKey||e.metaKey) && e.key === "Enter") send();
});

// ---------- 指标面板 ----------
function resetMetrics(){
  ["m-ttft","m-prefill","m-decode","m-ptok","m-ctok","m-total","m-gen"]
    .forEach(i => $(i).textContent = "—");
  $("b-prefill").style.width = "0"; $("b-decode").style.width = "0";
  const w = $("m-warn"); w.style.display = "none"; w.textContent = "";
}
function paint(m){
  $("m-ttft").textContent   = secs(m.ttft);
  $("m-prefill").textContent= m.prefill ? fmt(m.prefill,0)+" tok/s" : "—";
  $("m-ptok").textContent   = m.promptTokens ?? "—";
  $("m-decode").textContent = m.decode ? fmt(m.decode,1)+" tok/s" : "—";
  $("m-ctok").textContent   = m.completionTokens;
  $("m-total").textContent  = secs(m.totalMs);
  $("m-gen").textContent    = secs(m.genMs);

  // ★ 缓冲告警：宁可不给数字，也不给错的数字
  const w = $("m-warn");
  if(m.buffered){
    w.style.display = "block";
    w.textContent = "⚠️ 检测到响应被缓冲（非流式到达）\n"
      + `${m.completionTokens} 个 token 几乎同时在 ${secs(m.genMs)} 内到达，`
      + "因此：\n· TTFT 实际是整个生成耗时\n· decode 速度是假值\n\n"
      + "原因：前置反向代理（云 IDE 的 nginx）默认攒齐 SSE 才转发。\n"
      + "解法：用 scripts/serve_chat.sh 启动（它带 X-Accel-Buffering: no，"
      + "可让前置代理不缓冲）。";
  } else { w.style.display = "none"; w.textContent = ""; }

  // 条形以「当前历史最佳」为满格，便于横向比较（缓冲的轮次不参与）
  const best = runs.filter(r=>!r.buffered).reduce((a,r)=>({
    p:Math.max(a.p, r.prefill||0), d:Math.max(a.d, r.decode||0)}), {p:1,d:1});
  $("b-prefill").style.width = Math.min(100, (m.prefill||0)/best.p*100) + "%";
  $("b-decode").style.width  = Math.min(100, (m.decode ||0)/best.d*100) + "%";
}

function addHistory(m, prefill, decode){
  const n = runs.length;                       // runs 已先入账，故直接用其长度
  const tbody = hist.querySelector("tbody");
  if(!tbody) return;
  const tr = document.createElement("tr");
  if(m.buffered) tr.style.opacity = ".55";     // 缓冲的轮次数字不可信，弱化
  tr.innerHTML = `<td>${n}${m.buffered?" ⚠️":""}</td>
    <td>${(m.ttft/1000).toFixed(3)}</td>
    <td class="pre">${prefill?prefill.toFixed(0):"—"}</td>
    <td class="dec">${decode?decode.toFixed(1):"—"}</td>
    <td>${m.completionTokens}</td>`;
  tbody.appendChild(tr);
  hist.scrollTop = hist.scrollHeight;
}
// 表头
hist.innerHTML = `<table><thead><tr><th>#</th><th>TTFT s</th>
  <th>prefill</th><th>decode</th><th>out tok</th></tr></thead><tbody></tbody></table>`;

// ---------- 趋势图（无依赖 canvas） ----------
function drawSpark(){
  const c = $("spark"), dpr = window.devicePixelRatio || 1;
  const W = c.clientWidth, H = 70;
  c.width = W*dpr; c.height = H*dpr;
  const g = c.getContext("2d"); g.scale(dpr,dpr); g.clearRect(0,0,W,H);
  // 缓冲的轮次数字不可信，不画进趋势图
  const vals = runs.filter(r=>!r.buffered).map(r=>r.decode)
                   .filter(v=>v!=null && isFinite(v));
  if(vals.length < 1) return;
  const pad = {l:34, r:6, t:8, b:14};
  const max = Math.max(...vals) * 1.15, min = 0;
  const x = i => pad.l + (vals.length===1 ? (W-pad.l-pad.r)/2
                        : i*(W-pad.l-pad.r)/(vals.length-1));
  const y = v => pad.t + (1-(v-min)/(max-min||1))*(H-pad.t-pad.b);
  // 网格 + 刻度
  g.strokeStyle = "#2a2f3a"; g.fillStyle = "#8b93a3"; g.font = "10px sans-serif";
  g.lineWidth = 1;
  [0, .5, 1].forEach(f=>{
    const v = min + f*(max-min), yy = y(v);
    g.beginPath(); g.moveTo(pad.l, yy); g.lineTo(W-pad.r, yy); g.stroke();
    g.fillText(v.toFixed(0), 2, yy+3);
  });
  // 折线
  g.strokeStyle = "#3ecf8e"; g.lineWidth = 2; g.beginPath();
  vals.forEach((v,i)=> i ? g.lineTo(x(i),y(v)) : g.moveTo(x(i),y(v)));
  g.stroke();
  g.fillStyle = "#3ecf8e";
  vals.forEach((v,i)=>{ g.beginPath(); g.arc(x(i),y(v),2.5,0,7); g.fill(); });
}
window.addEventListener("resize", drawSpark);

// ---------- 简易压测：同一问题连发 N 次，统计波动 ----------
$("bench").onclick = async () => {
  if(sending) return;
  if(!base_) await connect();
  const q = $("input").value.trim() || "用一句话介绍昇腾 NPU。";
  const N = 5, keep = history.slice();
  const prev = $("send").disabled; $("send").disabled = true; sending = true;
  $("bench").textContent = `压测中 0/${N}`;
  const got = [];
  try{
    for(let i=0;i<N;i++){
      history.length = 0; history.push(...keep);      // 每轮同样上下文，保证可比
      const m = await ask(q, null, null);
      const prefill = (m.promptTokens && m.ttft>0) ? m.promptTokens/(m.ttft/1000) : null;
      const decode  = m.completionTokens>1 ? (m.completionTokens-1)/(m.genMs/1000) : null;
      got.push({ttft:m.ttft, prefill, decode});
      runs.push({ttft:m.ttft, prefill, decode, ctok:m.completionTokens});
      addHistory(m, prefill, decode); drawSpark();
      $("bench").textContent = `压测中 ${i+1}/${N}`;
    }
    const col = k => got.map(g=>g[k]).filter(v=>v!=null && isFinite(v)).sort((a,b)=>a-b);
    const stat = a => a.length ? {avg:a.reduce((x,y)=>x+y,0)/a.length,
                                  p50:a[Math.floor(a.length*.5)],
                                  p95:a[Math.min(a.length-1,Math.floor(a.length*.95))]} : null;
    const t = stat(col("ttft")), p = stat(col("prefill")), d = stat(col("decode"));
    const row = (n,s,u,f=1) => s ? `<div class="kv"><span>${n}</span>
        <span>avg ${f(s.avg)} / p50 ${f(s.p50)} / p95 ${f(s.p95)} ${u}</span></div>` : "";
    msgs.insertAdjacentHTML("beforeend",
      `<div class="msg bot"><div class="who">📊</div><div class="body">
       <b>压测结果（N=${got.length}，同样输入，串行）</b>
       ${row("TTFT (s)", t, "s", v=>(v/1000).toFixed(3))}
       ${row("Prefill (tok/s)", p, "tok/s", v=>v.toFixed(0))}
       ${row("Decode (tok/s)", d, "tok/s", v=>v.toFixed(1))}
       </div></div>`);
    msgs.scrollTop = msgs.scrollHeight;
  }catch(e){
    alert("压测中断: " + e.message);
  }finally{
    $("bench").textContent = "压测 ×5";
    sending = false; $("send").disabled = prev;
  }
};

autoConnect();
connect();
$("input").focus();
</script>
